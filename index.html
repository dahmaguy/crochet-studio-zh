<title>線作簿・鉤針織圖工作室</title>
<style>
:root{--ink:#352e2a;--muted:#82756d;--line:#e8ded5;--paper:#fffdfa;--bg:#f7f3ee;--rose:#bd7768;--rose2:#f5e7e2;--green:#71836f;--shadow:0 10px 32px #43332912}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.app{max-width:1420px;margin:auto;padding:28px 30px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;gap:13px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:var(--rose2);display:grid;place-items:center;font-size:25px}.eyebrow{color:var(--rose);font-size:12px;letter-spacing:.12em;font-weight:700}.brand h1{font-size:21px;margin:1px 0}.save{color:var(--muted);font-size:13px}.save b{color:var(--green)}.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:18px;align-items:start}.panel,.main{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:20px}.main{padding:24px;min-height:720px}.section-title{font-size:13px;font-weight:750;margin:0 0 14px}.field{margin-bottom:17px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:10px 11px;outline:none}.field input:focus,.field textarea:focus,.notation:focus{border-color:var(--rose)}.palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stitch-btn{border:1px solid var(--line);border-radius:12px;background:white;padding:9px 8px;display:flex;align-items:center;gap:9px;text-align:left;font-size:12px;transition:.15s}.stitch-btn:hover{border-color:var(--rose);background:#fff9f6;transform:translateY(-1px)}.glyph{width:26px;height:28px;display:inline-grid;place-items:center;color:#59443b;font-size:21px;flex:none}.glyph svg{width:24px;height:26px;overflow:visible;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.tip{margin-top:15px;padding:11px 12px;border-radius:11px;background:#f6f1eb;color:var(--muted);font-size:12px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.title-edit{border:0;background:transparent;font-size:20px;font-weight:750;width:min(360px,100%);outline:none}.switch{display:flex;padding:4px;border:1px solid var(--line);border-radius:12px;background:#f8f5f1}.switch button{border:0;background:transparent;border-radius:9px;padding:8px 13px;color:var(--muted);font-size:13px}.switch button.active{background:white;color:var(--rose);box-shadow:0 2px 7px #49332715;font-weight:700}.controls{display:flex;justify-content:space-between;align-items:center;padding:17px 0 14px;gap:12px}.controls-left,.controls-right{display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 12px;font-size:13px}.btn:hover{border-color:#d7b2a8}.btn.primary{background:var(--rose);color:white;border-color:var(--rose)}.btn.danger{color:#a85f52}.count{font-size:13px;color:var(--muted);margin-left:6px}.chart-wrap{background:#fcfaf7;border:1px solid #efe8e1;border-radius:15px;min-height:390px;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:center}.chart{display:flex;flex-direction:column;gap:8px;min-width:100%}.row{display:grid;grid-template-columns:96px 1fr 50px;align-items:center;gap:12px;min-width:max-content}.row-label{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}.row-label strong{color:var(--ink);font-size:13px}.arrow{color:var(--rose);font-size:19px;font-weight:800}.row-cells{display:flex;gap:3px;align-items:center;padding:6px 8px;border-radius:9px;background:white;border:1px solid #eee7df;min-height:49px}.cell{width:34px;height:34px;border:1px solid transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;position:relative}.cell:hover{background:var(--rose2);border-color:#e8c9c0}.cell .glyph{font-size:21px}.start-mark{width:2px;height:28px;background:var(--rose);position:absolute;left:-3px;top:2px;border-radius:2px}.row-end{font-size:12px;color:var(--muted)}.circular{margin:auto;display:grid;place-items:center;position:relative;width:350px;height:350px;min-width:350px}.ring{position:absolute;border:1px dashed #ddcfc3;border-radius:50%;width:var(--size);height:var(--size)}.round-n{position:absolute;font-size:10px;color:var(--muted);transform:translate(-50%,-50%)}.circle-center{width:48px;height:48px;border-radius:50%;background:var(--rose2);display:grid;place-items:center;color:var(--rose);font-size:12px;z-index:2}.notation-head{display:flex;justify-content:space-between;align-items:center;margin:21px 0 9px}.notation-head h3{font-size:14px;margin:0}.sync{font-size:11px;color:var(--green)}.notation{width:100%;height:105px;border:1px solid var(--line);border-radius:11px;padding:11px;resize:vertical;outline:none;font:13px/1.7 ui-monospace,monospace;background:white}.notation-help{font-size:11px;color:var(--muted);margin-top:6px}.right-panel{display:flex;flex-direction:column;gap:14px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat-card{background:#faf6f1;border-radius:12px;padding:12px}.stat-card span{display:block;color:var(--muted);font-size:11px}.stat-card strong{display:block;font-size:21px;margin-top:2px}.roundlist{display:flex;flex-direction:column;gap:7px;max-height:250px;overflow:auto}.round-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:9px 10px;border-radius:10px;font-size:12px}.round-item small{color:var(--muted)}.round-item.active{background:#fff8f5;border-color:#e7c8bf;color:var(--rose)}.notes{height:98px;resize:vertical}.progress{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.progress input{accent-color:var(--rose)}.subtle{font-size:12px;color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:24px}.row-help{font-size:12px;color:var(--muted);margin:0 0 14px}.delete-row{border:0;background:transparent;color:#b67d70;font-size:15px;padding:5px}.delete-row:hover{color:#874a40}@media(max-width:1050px){.layout{grid-template-columns:230px minmax(0,1fr)}.right-panel{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}.main{min-height:0}}@media(max-width:720px){.app{padding:16px 12px 32px}.layout{display:flex;flex-direction:column}.panel,.main{width:100%}.toolbar{align-items:flex-start;flex-direction:column}.controls{align-items:flex-start;flex-direction:column}.right-panel{display:flex}.chart-wrap{justify-content:flex-start;padding:12px}.row{grid-template-columns:76px 1fr 35px;gap:7px}.row-cells{gap:0;padding:4px}.cell{width:29px}.main{padding:17px}}
.round-n .glyph{width:28px;height:28px;border-radius:5px;background:transparent;color:#729682;font-weight:600}.round-n.active .glyph{background:#e5f0e9;color:#4f8067;box-shadow:0 0 0 1px #a8c4b1}.circular .ring{display:none}.circular .circle-center{background:transparent;color:#68917a;font-size:34px;font-weight:400}
@media(max-width:720px){
  .app{padding:10px 10px 26px}
  .top{display:flex;flex-direction:column;align-items:stretch;gap:12px;margin-bottom:12px}
  .top>div:last-child{justify-content:flex-start!important;gap:6px!important}
  .top .btn{min-height:42px;padding:8px 10px}
  .layout{display:flex;flex-direction:column;gap:12px}
  .layout>.main{order:0;width:100%;padding:13px;min-height:0}
  .layout>aside.panel{order:1;width:100%;padding:14px}
  .layout>.right-panel{order:2;width:100%;display:flex;gap:10px}
  .toolbar{flex-direction:column;align-items:stretch;gap:10px;padding-bottom:12px}
  .title-edit{width:100%;min-height:42px;font-size:18px}
  .switch{width:max-content;max-width:100%}
  .switch button{min-height:42px;padding:8px 14px}
  .controls{flex-direction:column;align-items:stretch;gap:8px;padding:12px 0}
  .controls-left,.controls-right{width:100%;display:flex;flex-wrap:wrap;gap:7px}
  .controls .btn{min-height:42px;padding:8px 10px}
  .controls-left #totalRows{height:42px!important}
  .count{margin-left:2px}
  .row-help{font-size:12px;margin-bottom:10px}
  .chart-wrap{min-height:300px;height:min(58vh,480px);padding:8px;justify-content:flex-start;align-items:flex-start;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
  .chart{width:max-content;min-width:max-content}
  .row{grid-template-columns:70px max-content 42px;gap:6px}
  .row-cells{gap:0;padding:4px}
  .cell{width:30px;height:34px}
  .circular{margin:8px}
  .notation-head{margin:15px 0 8px}
  .notation-head h3{font-size:15px}
  .notation-line{padding:10px}
  .notation-line-head{align-items:flex-start;font-size:12px}
  .repeat-segments{gap:9px}
  .repeat-segment{padding:8px}
  .segment-head{flex-wrap:wrap;justify-content:flex-start;gap:8px}
  .segment-head label{margin-left:auto}
  .notation-groups{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
  .stitch-group{display:grid;grid-template-columns:minmax(0,1fr) 16px 64px 30px;width:100%;min-width:0;gap:5px}
  .stitch-group select{width:100%;max-width:none;min-width:0;min-height:42px;font-size:14px;padding:6px}
  .stitch-group input{width:100%;min-width:0;min-height:42px;padding:6px;text-align:center}
  .group-remove{min-width:28px;min-height:36px}
  .repeat-count{min-height:40px}
  .notation-line-foot{flex-direction:column;align-items:stretch;gap:8px}
  .notation-line-foot .add-segment{width:100%;min-height:44px;white-space:normal;line-height:1.35}
  .notation-total{text-align:right}
  .notation-help{line-height:1.6}
  .roundlist{max-height:210px}
  input,select,textarea,button{scroll-margin:80px}
}
@media(max-width:390px){
  .app{padding-left:8px;padding-right:8px}
  .main{padding:10px!important}
  .controls-left,.controls-right{gap:5px}
  .controls .btn{font-size:12px;padding:7px 8px}
  .stitch-group{grid-template-columns:minmax(0,1fr) 14px 56px 28px;gap:4px}
  .segment-head label{margin-left:0}
}</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">🧶</div><div><div class="eyebrow">線作簿 · 編織小幫手</div><h1>鉤針織圖工作室</h1></div></div><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button class="btn" id="libraryBtn">作品庫</button><button class="btn" id="newProject">＋ 新作品</button><button class="btn" id="exportBtn">匯出</button><label class="btn" for="importFile">匯入</label><input id="importFile" type="file" accept="application/json" hidden><div class="save">● <b>已自動儲存</b></div></div></header>
<div class="layout">
<aside class="panel"><h2 class="section-title">作品設定</h2><div class="field"><label>作品名稱</label><input id="projectName" value="我的鉤針作品" placeholder="輸入作品名稱"></div><div class="field"><label>分類</label><input id="category" placeholder="例如：玩偶、衣物、居家"></div><div class="field"><label>線材 / 鉤針</label><textarea id="materials" placeholder="品牌、色號、批次、用量與鉤針尺寸"></textarea></div><h2 class="section-title" style="margin-top:24px">針法符號 <button class="btn" id="editStitches" style="float:right;padding:4px 8px">管理</button></h2><div class="palette" id="palette"></div><div class="tip" id="paletteTip">選取針法後，點圖上的符號即可替換；點「管理」新增、修改或刪除自訂符號。</div></aside>
<main class="main"><div class="toolbar"><input id="title" class="title-edit" value="春日小花杯墊" aria-label="織圖標題"><div class="switch" role="tablist"><button id="roundMode" class="active">圈編</button><button id="rowMode">往復編</button></div></div>
<div class="controls"><div class="controls-left"><button class="btn" id="prev">← 上一圈</button><button class="btn" id="next">下一圈 →</button><button class="btn primary" id="addRow">＋ 新增一列</button><span class="count" id="currentLabel"></span><span class="count" id="totalLabel">圈數</span><button class="btn" id="decreaseTotal" aria-label="減少圈數">−</button><input id="totalRows" type="number" min="1" step="1" value="1" aria-label="總圈數" style="width:66px;padding:7px 5px;border:1px solid var(--line);border-radius:9px;text-align:center"><button class="btn" id="increaseTotal" aria-label="增加圈數">＋</button></div><div class="controls-right"><label class="btn" style="display:flex;align-items:center;gap:6px"><input id="guidesToggle" type="checkbox" checked style="accent-color:var(--rose)">輔助線</label><button class="btn" id="addStitch">＋ 新增針法</button><button class="btn" id="rotateMode">自由旋轉圖示</button><button class="btn" id="resetPositions">重設本圈圖示</button><button class="btn danger" id="removeRow">刪除這列</button></div></div>
<p class="row-help" id="directionHelp">各圈針法資料可獨立編輯；圖上落點承接前一圈，加針會向外分出下一圈位置。拖曳圖示可調整位置；起點線對齊，沿逆時針閱讀。</p><div class="chart-wrap"><div id="chart" class="chart"></div></div>
<div class="notation-head"><h3>文字針法 <small style="font-size:11px;color:#9a6d5d;font-weight:500">多組針法版</small></h3><span class="sync">↔ 與織圖同步</span></div><div id="notationEditor" class="notation-editor"></div><textarea id="notation" class="notation" spellcheck="false" hidden></textarea><div class="notation-help" id="notationHelp">選擇針法符號並填入數量；每圈／列總針數會依針法自動計算。</div>
</main>
<aside class="right-panel"><section class="panel"><h2 class="section-title">作品統計</h2><div class="stat"><div class="stat-card"><span id="unitLabel">目前圈數</span><strong id="unitCount">1</strong></div><div class="stat-card"><span>本圈針數</span><strong id="stitchCount">6</strong></div></div><div style="margin-top:13px" class="progress"><input type="checkbox" id="done"><label for="done">完成目前這圈 / 列</label></div></section><section class="panel"><h2 class="section-title" id="listTitle">圈數一覽</h2><div id="roundList" class="roundlist"></div></section><section class="panel"><h2 class="section-title">編織備註</h2><div class="field" style="margin:0"><textarea id="notes" class="field notes" placeholder="記錄線材、鉤針尺寸或編織注意事項"></textarea></div><button class="btn" style="margin-top:10px;width:100%" id="copy">複製本圈紀錄</button></section></aside>
</div></div>
<div id="libraryModal" style="display:none;position:fixed;inset:0;background:#28221f66;z-index:10;padding:24px;overflow:auto"><div class="panel" style="max-width:780px;margin:5vh auto;padding:24px"><div style="display:flex;justify-content:space-between;align-items:center"><h2>我的作品</h2><button class="btn" id="closeLibrary">關閉</button></div><div id="projectList" class="roundlist"></div></div></div>
<script>
const STITCHES=[
{id:'ch',name:'鎖針',abbr:'ch',symbol:'○',hint:'起針、空氣針',count:0},{id:'magic',name:'魔術環',abbr:'MR',symbol:'⊗',hint:'環形起針',count:0},{id:'sl',name:'引拔針',abbr:'sl st',symbol:'•',hint:'引拔、連接',count:0},
{id:'sc',name:'短針',abbr:'sc / X',symbol:'×',hint:'短針'},{id:'sc_flo',name:'短針（前半針）',abbr:'sc FLO',symbol:'×̄',hint:'只鉤前半針'},{id:'sc_blo',name:'短針（後半針）',abbr:'sc BLO',symbol:'×̲',hint:'只鉤後半針'},{id:'esc',name:'延長短針',abbr:'esc',symbol:'×̸',hint:'延長短針'},
{id:'hdc',name:'中長針',abbr:'hdc',symbol:'⊤',hint:'中長針'},{id:'hdc_flo',name:'中長針（前半針）',abbr:'hdc FLO',symbol:'⊤̄',hint:'只鉤前半針'},{id:'hdc_blo',name:'中長針（後半針）',abbr:'hdc BLO',symbol:'⊤̲',hint:'只鉤後半針'},{id:'ehdc',name:'延長中長針',abbr:'ehdc',symbol:'⊤̸',hint:'延長中長針'},
{id:'dc',name:'長針',abbr:'dc',symbol:'┬',hint:'長針'},{id:'dc_flo',name:'長針（前半針）',abbr:'dc FLO',symbol:'┬̄',hint:'只鉤前半針'},{id:'dc_blo',name:'長針（後半針）',abbr:'dc BLO',symbol:'┬̲',hint:'只鉤後半針'},{id:'edc',name:'延長長針',abbr:'edc',symbol:'┬̸',hint:'延長長針'},
{id:'tr',name:'長長針',abbr:'tr',symbol:'╫',hint:'長長針（兩次繞線）'},{id:'tr_flo',name:'長長針（前半針）',abbr:'tr FLO',symbol:'╫̄',hint:'只鉤前半針'},{id:'tr_blo',name:'長長針（後半針）',abbr:'tr BLO',symbol:'╫̲',hint:'只鉤後半針'},{id:'dtr',name:'三長長針',abbr:'dtr',symbol:'╪',hint:'三次繞線'},{id:'trtr',name:'四長長針',abbr:'trtr',symbol:'╬',hint:'四次繞線'},
{id:'inc',name:'加針',abbr:'inc / V',symbol:'V',hint:'同一針目鉤兩針',count:2},{id:'sc_inc',name:'短針加針',abbr:'sc inc',symbol:'V×',hint:'同一針目鉤兩個短針',count:2},{id:'hdc_inc',name:'中長針加針',abbr:'hdc inc',symbol:'V⊤',hint:'同一針目鉤兩個中長針',count:2},{id:'dc_inc',name:'長針加針',abbr:'dc inc',symbol:'V┬',hint:'同一針目鉤兩個長針',count:2},
{id:'dec',name:'減針',abbr:'dec / A',symbol:'Λ',hint:'兩針併一針'},{id:'sc_dec',name:'短針減針',abbr:'sc2tog',symbol:'Λ×',hint:'兩短針併一針'},{id:'hdc_dec',name:'中長針減針',abbr:'hdc2tog',symbol:'Λ⊤',hint:'兩中長針併一針'},{id:'dc_dec',name:'長針減針',abbr:'dc2tog',symbol:'Λ┬',hint:'兩長針併一針'},
{id:'cluster3',name:'三長針併一針',abbr:'3dc-cl',symbol:'Y',hint:'三個長針併一針',count:1},{id:'puff',name:'泡芙針',abbr:'puff',symbol:'ϒ',hint:'同一針目拉出多個線圈',count:1},{id:'bobble',name:'玉米粒針',abbr:'bo',symbol:'●',hint:'多個未完成長針併一針',count:1},{id:'popcorn',name:'爆米花針',abbr:'pc',symbol:'◉',hint:'數個長針形成凸起',count:1},
{id:'shell3',name:'貝殼針（3長針）',abbr:'sh3',symbol:'⌒',hint:'同一針目鉤三長針',count:3},{id:'shell5',name:'貝殼針（5長針）',abbr:'sh5',symbol:'⌓',hint:'同一針目鉤五長針',count:5},{id:'vst',name:'V 字針',abbr:'V-st',symbol:'∨',hint:'同一針目鉤兩長針',count:2},{id:'fan',name:'扇形針',abbr:'fan',symbol:'♧',hint:'同一針目鉤多長針',count:5},{id:'picot',name:'狗牙針',abbr:'picot',symbol:'⌃',hint:'鎖針形成的小凸點',count:0},
{id:'fpdc',name:'前凸長針',abbr:'FPdc',symbol:'⊣┬',hint:'由前方繞過柱目鉤長針'},{id:'bpdc',name:'後凸長針',abbr:'BPdc',symbol:'⊢┬',hint:'由後方繞過柱目鉤長針'},
{id:'crosshdc',name:'交叉中長針',abbr:'cross hdc',symbol:'×T',hint:'兩個中長針交叉'}, {id:'yst',name:'Y 字針',abbr:'Y-st',symbol:'Y',hint:'Y 字針'}, {id:'revyst',name:'逆 Y 字針',abbr:'rev Y',symbol:'⅄',hint:'逆 Y 字針'},
{id:'chpicot',name:'三鎖狗牙針',abbr:'ch-3 picot',symbol:'♧',hint:'三鎖針狗牙裝飾'}, {id:'mesh',name:'方眼網格',abbr:'mesh',symbol:'□',hint:'鎖針與長針形成的方眼'}, {id:'wave',name:'五鎖弧形針',abbr:'ch-5 arch',symbol:'∩',hint:'五鎖針弧形網格'}

oupsForSegment=groupsFor(segment.stitches);segmentEl.querySelectorAll('.stitch-group').forEach((group,gi)=>group.querySelector('select').value=groupsForSegment[gi]?.id||'sc');const sync=()=>syncRecipeSegment(line,segmentEl);segmentEl.querySelectorAll('select,input:not(.repeat-count)').forEach(control=>control.addEventListener('input',sync));segmentEl.querySelectorAll('input:not(.repeat-count)').forEach(input=>input.addEventListener('change',sync));segmentEl.querySelector('.repeat-count').onchange=e=>{segment.repeat=Math.max(1,Math.min(20,Math.floor(Number(e.target.value)||1)));state.patterns[state.mode][ri]=expandRecipe(recipe);state.notationSource[state.mode]='';state.current=ri;render()};segmentEl.querySelector('.add-group').onclick=()=>{const previous=segment.stitches.at(-1),choice=state.selected&&state.selected!==previous?state.selected:(stitches().find(s=>s.id!==previous)?.id||'sc');segment.stitches.push(choice);state.selected=choice;state.patterns[state.mode][ri]=expandRecipe(recipe);state.notationSource[state.mode]='';render()};segmentEl.querySelector('.remove-segment').onclick=()=>{if(recipe.length===1){recipe[0].stitches=[];recipe[0].repeat=1}else recipe.splice(si,1);state.patterns[state.mode][ri]=expandRecipe(recipe);state.notationSource[state.mode]='';render()};segmentEl.querySelectorAll('.remove-stitch').forEach(btn=>btn.onclick=()=>{const all=[...segmentEl.querySelectorAll('.stitch-group')],pos=all.indexOf(btn.closest('.stitch-group'));if(all.length<=1)segment.stitches=[];else all[pos].remove();sync()})});line.querySelector('.add-segment').onclick=()=>{recipe.push({stitches:[state.selected||'sc'],repeat:1});state.patterns[state.mode][ri]=expandRecipe(recipe);state.notationSource[state.mode]='';render()}});$('notation').value=notationText()}
function syncRecipeSegment(line,segmentEl){const ri=+line.dataset.row,si=+segmentEl.dataset.segment,recipe=recipeFor(state.mode,ri),segment=recipe[si],base=[];segmentEl.querySelectorAll('.stitch-group').forEach(group=>{const id=group.querySelector('select').value,n=Math.max(0,Math.min(500,Math.floor(Number(group.querySelector('input').value)||0)));for(let j=0;j<n;j++)base.push(id)});segment.stitches=base;const pattern=expandRecipe(recipe);state.patterns[state.mode][ri]=pattern;state.notationSource[state.mode]='';state.current=ri;const total=fmt(count(pattern));line.querySelector('.group-total').textContent=`共 ${total} 針`;line.querySelector('.notation-total b').textContent=total;$('notation').value=notationText();renderChart();renderList(rows());save()}
notationText=function(){return rows().map((row,i)=>{const recipe=recipeFor(state.mode,i),text=recipe.map(segment=>{const groups=groupsFor(segment.stitches),expr=groups.map(g=>`${symbol(g.id).name} × ${g.n}`).join('，');return `${expr}${segment.repeat>1?`（重複 ${segment.repeat} 次）`:''}`}).filter(Boolean).join('；');return `第 ${i+1}${state.mode==='round'?'圈':'列'}：${text}（共 ${fmt(count(row))} 針）`}).join('\n')};
replaceStitch=function(ri,si){const mode=state.mode,recipe=recipeFor(mode,ri);let cursor=si;for(const segment of recipe){const repetitions=Math.max(1,Number(segment.repeat)||1),span=segment.stitches.length*repetitions;if(cursor<span){const pos=segment.stitches.length?cursor%segment.stitches.length:0;if(segment.stitches.length)segment.stitches[pos]=state.selected;break}cursor-=span}state.patterns[mode][ri]=expandRecipe(recipe);state.notationSource[mode]='';state.current=ri;render()};
function beginFreeRotation(el,e,mode,ri,si){const glyph=el.querySelector('.glyph');if(!glyph)return;const rect=glyph.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,angle=ev=>Math.atan2(ev.clientY-cy,ev.clientX-cx),tau=Math.PI*2;let last=angle(e),rotation=Number(state.rotations?.[mode]?.[ri]?.[si]||0),changed=false;const paint=()=>glyph.style.transform=`rotate(${rotation}deg)`;try{el.setPointerCapture(e.pointerId)}catch{};const move=ev=>{let delta=angle(ev)-last;if(delta>Math.PI)delta-=tau;if(delta<-Math.PI)delta+=tau;if(Math.abs(delta)>.004){rotation+=delta*180/Math.PI;changed=true;paint()}last=angle(ev)};const finish=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',finish);el.removeEventListener('pointercancel',finish);if(changed){state.rotations??={};state.rotations[mode]??={};state.rotations[mode][ri]??={};state.rotations[mode][ri][si]=((rotation%360)+360)%360;el.dataset.skipClick='1';setTimeout(()=>delete el.dataset.skipClick,0);save()}};el.addEventListener('pointermove',move);el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish)}
attachSymbolDragging=function(){document.querySelectorAll('#chart .round-n,#chart .cell').forEach(el=>{if(el.dataset.dragReady)return;el.dataset.dragReady='1';el.style.touchAction='none';el.addEventListener('click',e=>{if(el.dataset.skipClick){delete el.dataset.skipClick;e.preventDefault();e.stopImmediatePropagation()}},true);const ri=Number(el.dataset.row),si=Number(el.dataset.stitch),mode=state.mode;el.onclick=()=>{if(!rotateMode)replaceStitch(ri,si)};el.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(rotateMode){beginFreeRotation(el,e,mode,ri,si);return}const isCircle=el.classList.contains('round-n');state.positions??={};state.positions[mode]??={};state.positions[mode][ri]??={};const prior=state.positions[mode][ri][si]||{dx:0,dy:0},rect=isCircle?el.parentElement.getBoundingClientRect():null,zoom=rect&&el.parentElement.offsetWidth?rect.width/el.parentElement.offsetWidth:1,startX=e.clientX,startY=e.clientY,baseLeft=isCircle?(parseFloat(el.style.left)||0):prior.dx,baseTop=isCircle?(parseFloat(el.style.top)||0):prior.dy;let moved=false;try{el.setPointerCapture(e.pointerId)}catch{};const move=ev=>{const dx=(ev.clientX-startX)/zoom,dy=(ev.clientY-startY)/zoom;if(Math.hypot(dx,dy)>3)moved=true;if(isCircle){el.style.left=`${baseLeft+dx}px`;el.style.top=`${baseTop+dy}px`}else{el.style.left=prior.dx+dx+'px';el.style.top=prior.dy+dy+'px'}};const finish=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',finish);el.removeEventListener('pointercancel',finish);el.classList.remove('dragging');if(moved){const dx=(ev.clientX-startX)/zoom,dy=(ev.clientY-startY)/zoom;state.positions[mode][ri][si]={dx:prior.dx+dx,dy:prior.dy+dy};el.dataset.skipClick='1';setTimeout(()=>delete el.dataset.skipClick,0);save()}};el.classList.add('dragging');el.addEventListener('pointermove',move);el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish)})})};
$('rotateMode').onclick=()=>{rotateMode=!rotateMode;$('rotateMode').classList.toggle('primary',rotateMode);$('rotateMode').textContent=rotateMode?'拖曳圖示自由旋轉':'自由旋轉圖示';$('directionHelp').textContent=rotateMode?'拖曳符號繞中心旋轉任意角度；完成後再點一次「自由旋轉圖示」退出。':'針法圖示可拖曳移動；需要自由旋轉時，啟用上方「自由旋轉圖示」。'};render();
</script></body></html>
